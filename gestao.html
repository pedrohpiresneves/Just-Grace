<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão — Just Grace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 70'%3E%3Crect width='60' height='70' fill='%23070706'/%3E%3Cg stroke='%23f3ede1' stroke-width='2.4' stroke-linecap='round' fill='none'%3E%3Cline x1='30' y1='29' x2='30' y2='13'/%3E%3Cline x1='33.4' y1='29.7' x2='39.6' y2='14.9'/%3E%3Cline x1='36.4' y1='31.6' x2='47.7' y2='20.3'/%3E%3Cline x1='38.3' y1='34.6' x2='53.1' y2='28.4'/%3E%3Cline x1='39' y1='38' x2='55' y2='38'/%3E%3Cline x1='38.3' y1='41.4' x2='53.1' y2='47.6'/%3E%3Cline x1='36.4' y1='44.4' x2='47.7' y2='55.7'/%3E%3Cline x1='33.4' y1='46.3' x2='39.6' y2='61.1'/%3E%3Cline x1='30' y1='47' x2='30' y2='63'/%3E%3Cline x1='26.6' y1='46.3' x2='20.4' y2='61.1'/%3E%3Cline x1='23.6' y1='44.4' x2='12.3' y2='55.7'/%3E%3Cline x1='21.7' y1='41.4' x2='6.9' y2='47.6'/%3E%3Cline x1='21' y1='38' x2='5' y2='38'/%3E%3Cline x1='21.7' y1='34.6' x2='6.9' y2='28.4'/%3E%3Cline x1='23.6' y1='31.6' x2='12.3' y2='20.3'/%3E%3Cline x1='26.6' y1='29.7' x2='20.4' y2='14.9'/%3E%3C/g%3E%3Ccircle cx='30' cy='38' r='9' stroke='%23f3ede1' stroke-width='2.8' fill='none'/%3E%3Cpath d='M30 2 L30 29 M22 14 L38 14' stroke='%23f3ede1' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="store.js"></script>
<style>
  :root{
    --void:#070706; --charcoal:#111110; --panel:#161513;
    --panel-line: rgba(243,237,225,0.14);
    --gold:#b9ae98; --gold-bright:#f3ede1; --ivory:#f3ede1;
    --muted:#948d80; --faint:#57534a;
    --ok:#8fb08a; --warn:#d8b26a; --danger:#c9776f;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--void); color:var(--ivory); font-family:'Jost',sans-serif; font-weight:300;
    font-size:15px; line-height:1.5;
  }
  h1,h2,h3,.display{ font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:0.01em; }
  a{color:inherit; text-decoration:none;}
  button, input, select, textarea{ font-family:'Jost',sans-serif; color:inherit; }
  input,select,textarea{
    background:var(--void); border:1px solid var(--panel-line); color:var(--ivory);
    padding:10px 12px; font-size:0.92rem; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); }
  label{ display:block; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .eyebrow{ font-size:0.7rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold-bright); font-weight:500; display:block; margin-bottom:6px; }
  button{ background:none; border:none; cursor:pointer; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--panel-line); }

  /* ===== login ===== */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(circle at 50% 0%, #1b1a17 0%, var(--void) 65%);
  }
  .login-card{ width:min(380px,100%); text-align:center; }
  .login-card .mark{
    width:58px; height:68px; margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center; color:var(--gold-bright);
  }
  .login-card .mark svg{ width:100%; height:100%; }
  .login-card h1{ font-size:1.9rem; margin-bottom:6px; }
  .login-card p.hint{ color:var(--muted); font-size:0.85rem; margin-bottom:30px; }
  .login-card form{ text-align:left; display:flex; flex-direction:column; gap:16px; }
  .login-card button[type=submit]{
    margin-top:6px; background:var(--gold-bright); color:var(--void); font-weight:500;
    padding:13px; font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; transition:all .3s;
  }
  .login-card button[type=submit]:hover{ background:var(--gold); }
  .login-error{ background:rgba(201,119,111,0.12); border:1px solid rgba(201,119,111,0.4); color:#e2a49d; padding:10px 12px; font-size:0.82rem; }
  .login-back{ display:block; margin-top:26px; font-size:0.75rem; color:var(--muted); letter-spacing:0.05em; }
  .login-back:hover{ color:var(--gold-bright); }
  .login-demo{ margin-top:18px; font-size:0.72rem; color:var(--faint); line-height:1.6; border-top:1px solid var(--panel-line); padding-top:16px; }

  /* ===== shell ===== */
  #appShell{ display:none; min-height:100vh; }
  #appShell.open{ display:flex; }
  .sidebar{
    width:230px; flex-shrink:0; background:var(--charcoal); border-right:1px solid var(--panel-line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:26px 22px; border-bottom:1px solid var(--panel-line); }
  .sidebar-brand .mark{ width:32px; height:37px; display:flex; align-items:center; justify-content:center; color:var(--gold-bright); }
  .sidebar-brand .mark svg{ width:100%; height:100%; }
  .sidebar-brand div b{ display:block; font-size:0.98rem; letter-spacing:0.02em; }
  .sidebar-brand div small{ font-size:0.62rem; letter-spacing:0.22em; color:var(--muted); }
  .sidebar nav{ flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
  .sidebar nav button{
    display:flex; align-items:center; gap:12px; text-align:left; padding:11px 12px; font-size:0.85rem;
    color:var(--muted); transition:all .2s; border-left:2px solid transparent;
  }
  .sidebar nav button i{ font-style:normal; width:16px; text-align:center; color:var(--faint); }
  .sidebar nav button:hover{ color:var(--ivory); }
  .sidebar nav button.active{ color:var(--gold-bright); border-left-color:var(--gold); background:rgba(243,237,225,0.04); }
  .sidebar nav button.active i{ color:var(--gold-bright); }
  .sidebar nav a.store-link{
    display:flex; align-items:center; gap:12px; padding:11px 12px; font-size:0.85rem; color:var(--muted); margin-top:10px; border-top:1px solid var(--panel-line); padding-top:16px;
  }
  .sidebar nav a.store-link:hover{ color:var(--gold-bright); }
  .sidebar-user{ padding:16px 18px; border-top:1px solid var(--panel-line); display:flex; align-items:center; gap:10px; }
  .sidebar-user .av{ width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-bright); }
  .sidebar-user div{ flex:1; min-width:0; }
  .sidebar-user b{ display:block; font-size:0.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-user small{ font-size:0.68rem; color:var(--muted); }
  .sidebar-user button{ font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .sidebar-user button:hover{ color:var(--danger); }

  main.content{ flex:1; min-width:0; padding:34px 40px 60px; }
  .content-head{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
  .content-head h2{ font-size:2rem; margin-top:4px; }
  .content-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ padding:10px 18px; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--panel-line); transition:all .25s; white-space:nowrap; }
  .btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn.primary{ background:var(--gold-bright); color:var(--void); border-color:var(--gold-bright); font-weight:500; }
  .btn.primary:hover{ background:var(--gold); }
  .btn.danger{ border-color:rgba(201,119,111,0.5); color:#e2a49d; }
  .btn.danger:hover{ background:rgba(201,119,111,0.12); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* KPI cards */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:30px; }
  .kpi{ background:var(--charcoal); border:1px solid var(--panel-line); padding:20px; }
  .kpi span{ font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .kpi strong{ display:block; font-family:'Cormorant Garamond',serif; font-size:2.1rem; font-style:italic; color:var(--gold-bright); margin:6px 0 2px; }
  .kpi small{ font-size:0.74rem; color:var(--faint); }

  .panel-block{ background:var(--charcoal); border:1px solid var(--panel-line); padding:24px; margin-bottom:24px; }
  .data-table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  .data-table th{ text-align:left; padding:10px 12px; color:var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--panel-line); }
  .data-table td{ padding:12px; border-bottom:1px solid var(--panel-line); color:var(--ivory); vertical-align:top; }
  .data-table tr:last-child td{ border-bottom:none; }
  .panel-block h3{ font-size:1.2rem; margin-bottom:16px; }
  .empty-state{ color:var(--muted); font-size:0.88rem; padding:30px 10px; text-align:center; }

  .alert-box{ background:rgba(216,178,106,0.1); border:1px solid rgba(216,178,106,0.35); padding:14px 18px; margin-bottom:22px; font-size:0.86rem; }
  .alert-box b{ color:var(--warn); display:block; margin-bottom:2px; }

  /* products grid */
  .search-row{ position:relative; max-width:320px; }
  .search-row input{ padding-left:32px; }
  .search-row::before{ content:'⌕'; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }

  .products-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:18px; margin-top:22px; }
  .product-card{ background:var(--charcoal); border:1px solid var(--panel-line); padding:16px; display:flex; flex-direction:column; gap:10px; }
  .product-card.archived{ opacity:0.5; }
  .product-art{ height:110px; background:linear-gradient(160deg, var(--panel), var(--charcoal)); display:flex; align-items:center; justify-content:center; }
  .product-art svg{ width:44%; }
  .product-card h4{ font-size:1.02rem; font-family:'Cormorant Garamond',serif; font-weight:600; }
  .product-card .meta{ font-size:0.74rem; color:var(--muted); }
  .product-card .price{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-bright); font-size:1.2rem; }
  .stock-row{ display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--panel-line); padding-top:10px; }
  .stock-pill{ font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; padding:3px 7px; }
  .stock-pill.ok{ color:var(--ok); }
  .stock-pill.low{ color:var(--warn); }
  .stock-pill.out{ color:var(--danger); }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-ctrl button{ width:24px; height:24px; border:1px solid var(--panel-line); font-size:0.9rem; }
  .qty-ctrl button:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .product-actions{ display:flex; gap:8px; }
  .product-actions button{ flex:1; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; border:1px solid var(--panel-line); padding:7px; }
  .product-actions button:hover{ border-color:var(--gold); color:var(--gold-bright); }

  /* orders */
  .orders-list{ display:flex; flex-direction:column; gap:10px; }
  .order-row{ background:var(--charcoal); border:1px solid var(--panel-line); padding:16px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; cursor:pointer; transition:border-color .2s; }
  .order-row:hover{ border-color:var(--gold); }
  .order-row.followup{ border-left:3px solid var(--warn); }
  .order-row .oid{ font-size:0.72rem; color:var(--muted); letter-spacing:0.05em; width:80px; }
  .order-row .oname{ flex:1; min-width:160px; }
  .order-row .oname b{ display:block; font-size:0.96rem; }
  .order-row .oname small{ color:var(--muted); font-size:0.74rem; }
  .order-row .ototal{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-bright); font-size:1.15rem; width:110px; text-align:right; }
  .status-pill{ font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--panel-line); white-space:nowrap; }
  .status-pill.payment_pending{ color:#a9c1e8; border-color:rgba(169,193,232,0.35); }
  .status-pill.paid, .status-pill.fulfilled, .status-pill.delivered{ color:var(--ok); border-color:rgba(143,176,138,0.4); }
  .status-pill.cancelled{ color:var(--danger); border-color:rgba(201,119,111,0.4); }
  .status-pill.shipped{ color:var(--gold-bright); border-color:var(--panel-line); }

  /* customers */
  .customer-table{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  .customer-table th{ text-align:left; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--panel-line); }
  .customer-table td{ padding:12px; border-bottom:1px solid var(--panel-line); }
  .customer-table tr.cust-row{ cursor:pointer; transition:background .2s; }
  .customer-table tr.cust-row:hover{ background:rgba(243,237,225,0.03); }
  .cust-detail-row td{ background:var(--void); padding:18px; }
  .cust-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .cust-detail-grid dl{ display:grid; grid-template-columns:110px 1fr; gap:6px 10px; font-size:0.85rem; }
  .cust-detail-grid dt{ color:var(--muted); }
  .cust-contact-links{ display:flex; gap:10px; margin-top:12px; }
  .cust-contact-links a{ border:1px solid var(--panel-line); padding:7px 14px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; }
  .cust-contact-links a:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .classification-pill{ font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; padding:4px 9px; border:1px solid var(--panel-line); }
  .classification-pill.VIP{ color:var(--gold-bright); border-color:var(--gold); }
  .classification-pill.Recorrente{ color:var(--ok); }
  .classification-pill.Ativo{ color:#a9c1e8; }
  .classification-pill.Novo{ color:var(--muted); }
  .classification-pill.Lead{ color:var(--faint); }

  /* delivery */
  .delivery-zones{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:16px; }
  .zone-card{ background:var(--charcoal); border:1px solid var(--panel-line); padding:18px; }
  .zone-card h4{ font-size:1rem; margin-bottom:12px; color:var(--gold-bright); }
  .zone-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--panel-line); font-size:0.84rem; }
  .zone-row:last-child{ border-bottom:none; }
  .zone-fee{ display:flex; align-items:center; gap:6px; }
  .zone-fee input{ width:80px; padding:6px 8px; font-size:0.82rem; }
  .zone-fee button{ font-size:0.68rem; text-transform:uppercase; border:1px solid var(--panel-line); padding:6px 10px; }
  .zone-fee button:hover{ border-color:var(--gold); color:var(--gold-bright); }

  /* history */
  .history-list{ display:flex; flex-direction:column; gap:2px; }
  .history-item{ display:flex; gap:14px; padding:14px 4px; border-bottom:1px solid var(--panel-line); }
  .history-item .hicon{ width:30px; height:30px; border:1px solid var(--panel-line); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-bright); }
  .history-item p{ font-size:0.88rem; }
  .history-item small{ color:var(--muted); font-size:0.74rem; }

  /* users */
  .users-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; }
  .user-card{ background:var(--charcoal); border:1px solid var(--panel-line); padding:18px; }
  .user-card.inactive{ opacity:0.5; }
  .user-card .head{ display:flex; gap:12px; align-items:center; margin-bottom:12px; }
  .user-card .av{ width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-bright); }
  .user-card .head div small{ display:block; font-size:0.64rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .user-card .head div b{ font-size:0.98rem; }
  .user-card .perms{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .user-card .perms span{ font-size:0.65rem; border:1px solid var(--panel-line); padding:3px 8px; color:var(--muted); }
  .user-card footer{ display:flex; justify-content:space-between; align-items:center; }
  .user-card footer small.active{ color:var(--ok); }
  .user-card footer small.inactive{ color:var(--danger); }
  .user-card footer button{ font-size:0.7rem; text-transform:uppercase; border:1px solid var(--panel-line); padding:6px 12px; }
  .user-card footer button:hover{ border-color:var(--gold); color:var(--gold-bright); }

  /* modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(4,4,3,0.75); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .3s; }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal{ background:var(--charcoal); border:1px solid var(--panel-line); width:min(640px,100%); max-height:88vh; display:flex; flex-direction:column; transform:translateY(12px); transition:transform .3s; }
  .modal-backdrop.open .modal{ transform:translateY(0); }
  .modal.wide{ width:min(880px,100%); }
  .modal header{ display:flex; align-items:flex-start; justify-content:space-between; padding:22px 26px; border-bottom:1px solid var(--panel-line); }
  .modal header h3{ font-size:1.35rem; }
  .modal header button.close{ font-size:1.3rem; color:var(--muted); line-height:1; }
  .modal header button.close:hover{ color:var(--gold-bright); }
  .modal-body{ padding:22px 26px; overflow-y:auto; flex:1; }
  .modal-body .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .modal-body .field{ margin-bottom:16px; }
  .modal-body .field.wide{ grid-column:1/-1; }
  .modal footer{ padding:18px 26px; border-top:1px solid var(--panel-line); display:flex; justify-content:flex-end; gap:10px; }
  .field-hint{ font-size:0.72rem; color:var(--faint); margin-top:6px; }

  .perm-check{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--panel-line); }
  .perm-check:last-child{ border-bottom:none; }
  .perm-check input{ width:auto; margin-top:3px; }
  .perm-check b{ display:block; font-size:0.86rem; }
  .perm-check small{ color:var(--muted); font-size:0.76rem; }

  .order-items-table{ width:100%; border-collapse:collapse; font-size:0.84rem; margin-bottom:16px; }
  .order-items-table td{ padding:8px 0; border-bottom:1px solid var(--panel-line); }
  .order-items-table td:last-child{ text-align:right; color:var(--gold-bright); font-family:'Cormorant Garamond',serif; }
  .totals-row{ display:flex; justify-content:space-between; font-size:0.86rem; padding:5px 0; }
  .totals-row.grand{ font-size:1.05rem; border-top:1px solid var(--panel-line); margin-top:8px; padding-top:12px; color:var(--gold-bright); font-family:'Cormorant Garamond',serif; }
  .timeline-item{ padding:8px 0; border-bottom:1px solid var(--panel-line); font-size:0.82rem; }
  .timeline-item b{ display:block; }
  .timeline-item small{ color:var(--muted); }

  .notice-toast{ position:fixed; bottom:26px; right:26px; background:var(--charcoal); border:1px solid var(--gold); padding:14px 20px; font-size:0.85rem; z-index:600; display:flex; align-items:center; gap:16px; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
  .notice-toast span{ cursor:pointer; color:var(--muted); }
  .notice-toast span:hover{ color:var(--gold-bright); }

  .manual-item-row{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  .manual-item-row select{ flex:1; }
  .manual-item-row .qc{ display:flex; align-items:center; gap:6px; }
  .manual-item-row .qc button{ width:22px; height:22px; border:1px solid var(--panel-line); }
  .manual-item-row button.rm{ color:var(--danger); font-size:1rem; }

  @media (max-width:920px){
    .sidebar{ position:fixed; z-index:200; transform:translateX(-100%); transition:transform .3s; }
    .sidebar.open{ transform:translateX(0); }
    main.content{ padding:22px 16px 50px; }

<script>
const S = window.JGStore;
const money = S.money;

// busca a lista de usuários mais recente assim que a página abre, para que
// contas criadas em outro dispositivo já funcionem no primeiro login aqui.
let usersSyncPromise = Promise.resolve();
if(S.isSyncConfigured && S.isSyncConfigured()){
  usersSyncPromise = S.syncUsers();
}

/* ================= STATE ================= */
let session = S.getSession();
let currentView = 'dashboard';
let productSearch = '';
let customerSearch = '';
let customerSegment = 'all';
let expandedCustomer = null;

const permissionLabels = {
  orders_manage: ['Gestão de pedidos', 'Confirmar vendas, pagamentos e entregas'],
  products_manage: ['Cadastro de produtos', 'Criar, editar e arquivar peças'],
  stock_manage: ['Controle de estoque', 'Alterar quantidades disponíveis'],
  delivery_manage: ['Fretes', 'Alterar taxas de entrega por zona'],
  users_manage: ['Gestão de usuários', 'Criar contas e definir acessos'],
  finance_manage: ['Financeiro', 'Registrar e ver custos e despesas'],
};

const navItems = [
  { id: 'dashboard', label: 'Dashboard', icon: '▦' },
  { id: 'products', label: 'Produtos', icon: '◇' },
  { id: 'orders', label: 'Pedidos', icon: '▤', perm: 'orders_manage' },
  { id: 'customers', label: 'Clientes', icon: '♧', perm: 'orders_manage' },
  { id: 'delivery', label: 'Fretes', icon: '⌖', perm: 'delivery_manage' },
  { id: 'finance', label: 'Financeiro', icon: '¤', perm: 'finance_manage' },
  { id: 'history', label: 'Histórico', icon: '↺' },
  { id: 'users', label: 'Usuários', icon: '♙', perm: 'users_manage' },
];

function can(perm){
  if(!perm) return true;
  if(!session) return false;
  return session.role === 'admin' || (session.permissions||[]).includes(perm);
}

/* ================= LOGIN ================= */
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const box = document.getElementById('loginErrorBox');
  box.innerHTML = '';
  const submitBtn = e.target.querySelector('button[type="submit"], input[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    // espera a busca de usuários mais recentes terminar, com um limite de
    // 4s pra não travar o login se a rede estiver lenta/fora do ar.
    await Promise.race([
      usersSyncPromise,
      new Promise(resolve => setTimeout(resolve, 4000)),
    ]);
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value;
    const users = S.getUsers().filter(u => u && u.email);
    const user = users.find(u => String(u.email).toLowerCase() === email);
    if(!user || user.password !== pass){
      box.innerHTML = '<div class="login-error">E-mail ou senha inválidos.</div>';
      return;
    }
    if(user.status !== 'active'){
      box.innerHTML = '<div class="login-error">Este acesso está inativo. Fale com um administrador.</div>';
      return;
    }
    session = { id:user.id, name:user.name, email:user.email, role:user.role, permissions:user.permissions||[] };
    S.setSession(session);
    S.addAudit('login', `${user.name} entrou no painel.`, user.name);
    boot();
  }catch(err){
    console.error('Erro no login:', err);
    box.innerHTML = '<div class="login-error">Ocorreu um erro ao entrar. Veja o console (F12) ou avise o suporte.</div>';
  }finally{
    if(submitBtn) submitBtn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(session) S.addAudit('logout', `${session.name} saiu do painel.`, session.name);
  S.clearSession();
  session = null;
  document.getElementById('appShell').classList.remove('open');
  document.getElementById('loginScreen').style.display = 'flex';
});

/* ================= BOOT / NAV ================= */
function boot(){
  try{
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').classList.add('open');
    document.getElementById('userAvatar').textContent = session.name.charAt(0);
    document.getElementById('userName').textContent = session.name;
    document.getElementById('userRole').textContent = session.role === 'admin' ? 'Administrador' : 'Usuário com permissões';
    renderNav();
    goTo(navItems.some(n=>n.id===currentView && can(n.perm)) ? currentView : 'dashboard');
  }catch(err){
    console.error('Erro ao abrir o painel:', err);
    alert('Entramos, mas houve um erro ao carregar o painel. Veja o console (F12) ou avise o suporte.');
  }
}
if(session) boot();

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = navItems.filter(n=>can(n.perm)).map(n =>
    `<button data-view="${n.id}" class="${n.id===currentView?'active':''}"><i>${n.icon}</i>${n.label}</button>`
  ).join('') + `<a class="store-link" href="index.html" target="_blank"><i>↗</i>Ver A Loja</a>`;
  nav.querySelectorAll('button[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=> goTo(btn.dataset.view));
  });
}

function goTo(view){
  currentView = view;
  renderNav();
  const titles = {
    dashboard: ['DASHBOARD','Visão Geral'], products:['CATÁLOGO','Produtos E Estoque'],
    orders:['VENDAS','Pedidos'], customers:['RELACIONAMENTO','Clientes'],
    delivery:['ENTREGA','Fretes Por Zona'], finance:['FINANCEIRO','Custos E Despesas'],
    history:['REGISTRO','Histórico De Alterações'],
    users:['EQUIPE','Usuários E Permissões'],
  };
  document.getElementById('viewEyebrow').textContent = titles[view][0];
  document.getElementById('viewTitle').textContent = titles[view][1];
  renderView();
}

function renderView(){
  const actions = document.getElementById('viewActions');
  actions.innerHTML = '';
  const body = document.getElementById('viewBody');
  if(currentView === 'dashboard'){ renderDashboard(body); }
  else if(currentView === 'products'){ renderProducts(body, actions); }
  else if(currentView === 'orders'){ renderOrders(body, actions); }
  else if(currentView === 'customers'){ renderCustomers(body, actions); }
  else if(currentView === 'delivery'){ renderDelivery(body); }
  else if(currentView === 'finance'){ renderFinance(body, actions); }
  else if(currentView === 'history'){ renderHistory(body); }
  else if(currentView === 'users'){ renderUsers(body, actions); }
}

/* ================= DASHBOARD ================= */
function renderDashboard(body){
  const products = S.getProducts();
  const orders = S.getOrders();
  const customers = S.getCustomers();
  const active = products.filter(p=>p.status==='active');
  const low = active.filter(p=>{ const t=S.productTotalStock(p); return t>0 && t<=3; }).length;
  const out = active.filter(p=>S.productTotalStock(p)===0).length;
  const revenue = orders.filter(o=>['paid','preparing','shipped','fulfilled'].includes(o.status)).reduce((s,o)=>s+o.totalCents,0);
  const pendingContact = orders.filter(o=>needsFollowUp(o)).length;
  const pf = calcProfit(orders);

  body.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><span>Produtos Ativos</span><strong>${active.length}</strong><small>no catálogo</small></div>
      <div class="kpi"><span>Estoque Baixo</span><strong>${low}</strong><small>até 3 peças</small></div>
      <div class="kpi"><span>Esgotados</span><strong>${out}</strong><small>precisam de atenção</small></div>
      <div class="kpi"><span>Pedidos</span><strong>${orders.length}</strong><small>recebidos no total</small></div>
      <div class="kpi"><span>Faturamento</span><strong>${money(revenue)}</strong><small>pedidos pagos, com frete</small></div>
      <div class="kpi"><span>Lucro</span><strong style="color:${pf.profit>=0?'var(--ok)':'var(--danger)'}">${money(pf.profit)}</strong><small>inclui ${money(pf.delivery)} de frete · custo dos produtos ${money(pf.cost)}</small></div>
      <div class="kpi"><span>Clientes</span><strong>${customers.length}</strong><small>cadastrados</small></div>
    </div>
    ${pendingContact ? `<div class="alert-box"><b>Clientes aguardando contato</b>Há ${pendingContact} pedido(s) sem pagamento ou contato concluído há mais de 15 minutos.</div>` : ''}
    <div class="panel-block">
      <h3>Pedidos Recentes</h3>
      ${orders.length ? orders.slice(0,6).map(o=>orderRowHTML(o)).join('') : '<div class="empty-state">Nenhum pedido recebido ainda. Assim que alguém finalizar a sacola na loja, o pedido aparece aqui automaticamente.</div>'}
    </div>
    <div class="panel-block">
      <h3>Estoque Para Revisar</h3>
      ${active.filter(p=>S.productTotalStock(p)<=3).length ? `<div class="products-grid">${active.filter(p=>S.productTotalStock(p)<=3).map(p=>productCardHTML(p)).join('')}</div>` : '<div class="empty-state">Nenhuma peça com estoque baixo no momento.</div>'}
    </div>
  `;
  attachOrderRowEvents(body);
  attachProductCardEvents(body);
}

const PAID_STATUSES = ['paid','preparing','shipped','fulfilled'];
/* Custo dos produtos de um pedido (custo cadastrado no produto × quantidade). */
function orderProductCostCents(order){
  const prods = S.getProducts();
  return (order.items||[]).reduce((s,i)=>{
    const p = prods.find(x=>x.id===i.productId) || prods.find(x=>x.name===i.name);
    return s + ((p && p.costCents) || 0) * (i.quantity ?? i.qty ?? 0);
  }, 0);
}
/* Lucro = total pago pelo cliente (produtos + FRETE − desconto) − custo dos produtos. */
function calcProfit(orders){
  const paid = orders.filter(o=>PAID_STATUSES.includes(o.status));
  const revenue = paid.reduce((s,o)=>s+(o.totalCents||0),0);
  const delivery = paid.reduce((s,o)=>s+(o.deliveryFeeCents ?? o.deliveryCents ?? 0),0);
  const cost = paid.reduce((s,o)=>s+orderProductCostCents(o),0);
  return { revenue, delivery, cost, profit: revenue - cost };
}

function needsFollowUp(order){
  return ['payment_error','payment_expired','payment_cancelled'].includes(order.status)
    && (Date.now() - new Date(order.createdAt).getTime()) >= 15*60*1000;
}

/* ================= PRODUTOS ================= */
function renderProducts(body, actions){
  if(can('products_manage')){
    actions.innerHTML = `<button class="btn primary" id="newProductBtn">＋ Novo Produto</button>`;
  }
  const products = S.getProducts().filter(p => p.name.toLowerCase().includes(productSearch.toLowerCase()));
  body.innerHTML = `
    <div class="search-row"><input type="text" id="productSearchInput" placeholder="Buscar produto" value="${escapeAttr(productSearch)}"></div>
    <div class="products-grid" id="productsGrid">
      ${products.length ? products.map(p=>productCardHTML(p, true)).join('') : '<div class="empty-state">Nenhum produto encontrado.</div>'}
    </div>
  `;
  document.getElementById('productSearchInput').addEventListener('input', e=>{
    productSearch = e.target.value; renderProducts(body, actions);
  });
  if(can('products_manage')){
    document.getElementById('newProductBtn').addEventListener('click', ()=> openProductModal());
  }
  attachProductCardEvents(body);
}

function productCardHTML(p, withActions){
  const total = S.productTotalStock(p);
  const stockClass = total===0 ? 'out' : total<=3 ? 'low' : 'ok';
  const stockLabel = total===0 ? 'Esgotado' : total<=3 ? 'Estoque baixo' : 'Disponível';
  const sizesBreakdown = S.normalizeSizes(p).map(s => `${escapeHtml(s.label)}: ${s.stock}`).join(' · ');
  return `
    <div class="product-card ${p.status==='archived'?'archived':''}" data-id="${p.id}">
      <div class="product-art"><svg viewBox="0 0 100 100">${p.svg||''}</svg></div>
      <h4>${escapeHtml(p.name)}</h4>
      <div class="meta">${escapeHtml(p.tag)} · ${escapeHtml(p.sku||'')}</div>
      <div class="price">${money(p.priceCents)}</div>
      ${p.costCents ? `<div class="meta">Custo: ${money(p.costCents)} · Lucro: ${money(p.priceCents - p.costCents)} (${p.priceCents ? Math.round((p.priceCents - p.costCents) / p.priceCents * 100) : 0}%)</div>` : `<div class="meta">Custo: não informado</div>`}
      <div class="stock-row">
        <span class="stock-pill ${stockClass}">${stockLabel}</span>
        <b>${total} un.</b>
      </div>
      <div class="meta" style="margin-top:4px;">${sizesBreakdown}</div>
      ${withActions && can('products_manage') ? `
      <div class="product-actions">
        <button data-action="edit">Editar</button>
        <button data-action="toggle">${p.status==='active'?'Arquivar':'Restaurar'}</button>
      </div>` : ''}
    </div>`;
}

function attachProductCardEvents(root){
  root.querySelectorAll('.product-card').forEach(card=>{
    const id = card.dataset.id;
    const editBtn = card.querySelector('[data-action="edit"]');
    if(editBtn) editBtn.addEventListener('click', ()=>{

      S.addAudit('product_toggle', `${p.name} foi ${p.status==='active'?'restaurado':'arquivado'}.`, session.name);
      renderView();
    });
  });
}

function openProductModal(product){
  const isNew = !product;
  const p = product || { id:S.uid('p'), cat:'basicas', tag:'Camiseta', name:'', desc:'', priceCents:0, status:'active', sku:'', svg:'<circle cx="50" cy="50" r="28" stroke="#f3ede1" stroke-width="2" fill="none"/>', images:[], sizes:[] };
  let productImages = (p.images && p.images.length ? p.images.slice() : (p.image ? [p.image] : [])).slice(0, 8);
  const MAX_PHOTOS = 8;

  function renderPhotoPreviews(){
    const wrap = document.getElementById('fImagesWrap');
    wrap.innerHTML = productImages.map((src, i) => `
      <div style="position:relative; width:90px; height:90px;">
        <img src="${src}" style="width:100%; height:100%; object-fit:cover; border:1px solid var(--panel-line);">
        <button type="button" data-remove-photo="${i}" style="position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff; border:none; cursor:pointer; font-size:0.8rem; line-height:1;">×</button>
        ${i===0 ? `<span style="position:absolute; bottom:2px; left:2px; background:rgba(0,0,0,0.65); color:var(--gold-bright); font-size:0.6rem; padding:2px 5px; text-transform:uppercase; letter-spacing:0.05em;">Capa</span>` : ''}
      </div>
    `).join('');
    document.getElementById('fImageFile').disabled = productImages.length >= MAX_PHOTOS;
    document.getElementById('fPhotoCount').textContent = productImages.length + '/' + MAX_PHOTOS;
    wrap.querySelectorAll('[data-remove-photo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        productImages.splice(Number(btn.dataset.removePhoto), 1);
        renderPhotoPreviews();
      });
    });
  }

  showModal(`
    <header><h3>${isNew?'Novo Produto':'Editar Produto'}</h3><button class="close" id="mClose">×</button></header>
    <div class="modal-body">
      <div class="grid2">
        <div class="field wide"><label>Nome</label><input id="fName" value="${escapeAttr(p.name)}" placeholder="Ex.: Ave Maria — Manuscrito"></div>
        <div class="field"><label>Categoria</label>
          <select id="fCat">
            <option value="basicas" ${p.cat==='basicas'?'selected':''}>Camisas básicas</option>
          </select>
        </div>
        <div class="field"><label>Etiqueta</label><input id="fTag" value="${escapeAttr(p.tag)}" placeholder="Camiseta"></div>
        <div class="field"><label>Preço (R$)</label><input id="fPrice" type="number" min="0" step="0.01" value="${isNew ? '' : (p.priceCents/100).toFixed(2)}" placeholder="0,00"></div>
        <div class="field"><label>Custo do produto (R$)</label><input id="fCost" type="number" min="0" step="0.01" value="${p.costCents ? (p.costCents/100).toFixed(2) : ''}" placeholder="0,00"></div>
        <div class="field"><label>SKU</label><input id="fSku" value="${escapeAttr(p.sku||'')}" placeholder="JG-BAS-004"></div>
        <div class="field"><label>Status</label>
          <select id="fStatus">
            <option value="active" ${p.status==='active'?'selected':''}>Ativo</option>
            <option value="archived" ${p.status==='archived'?'selected':''}>Arquivado</option>
          </select>
        </div>
        <div class="field wide">
          <label>Fotos Do Produto (até 8 — JPG ou PNG) — <span id="fPhotoCount">0/8</span></label>
          <div id="fImagesWrap" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;"></div>
          <input type="file" id="fImageFile" accept="image/jpeg,image/png" multiple>
        </div>
        <div class="field wide">
          <label>Tamanhos E Estoque</label>
          <div id="fSizesWrap"></div>
          <button type="button" class="btn" id="fSizeAdd" style="margin-top:8px;">＋ Adicionar Tamanho</button>
        </div>
        <div class="field wide"><label>Descrição</label><textarea id="fDesc" rows="3" placeholder="Descrição exibida na loja">${escapeHtml(p.desc)}</textarea></div>
      </div>
      <div class="field-hint">Cada foto é redimensionada e comprimida automaticamente ao carregar. A primeira foto é a capa mostrada no catálogo; as demais aparecem no carrossel. Se não carregar nenhuma, o card mostra o símbolo de linha fina padrão.</div>
    </div>
    <footer>
      ${!isNew ? `<button class="btn danger" id="mDelete" style="margin-right:auto;">Excluir produto</button>` : ''}
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mSave">Salvar</button>
    </footer>
  `);
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  let productSizes = S.normalizeSizes(p).map(s => ({ label: s.label, stock: s.stock || 0 }));
  if(isNew) productSizes = [{label:'P',stock:0},{label:'M',stock:0},{label:'G',stock:0},{label:'GG',stock:0}];

  function renderSizesEditor(){
    const wrap = document.getElementById('fSizesWrap');
    wrap.innerHTML = productSizes.map((sz, i) => `
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <input type="text" data-size-label="${i}" value="${escapeAttr(sz.label)}" placeholder="Tamanho (ex: P)" style="max-width:110px;">
        <input type="number" min="0" data-size-stock="${i}" value="${sz.stock}" placeholder="Qtd." style="max-width:100px;">
        <button type="button" data-size-remove="${i}" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;">×</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-size-label]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ productSizes[Number(inp.dataset.sizeLabel)].label = inp.value; });
    });
    wrap.querySelectorAll('[data-size-stock]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ productSizes[Number(inp.dataset.sizeStock)].stock = Math.max(0, Number(inp.value||0)); });
    });
    wrap.querySelectorAll('[data-size-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        productSizes.splice(Number(btn.dataset.sizeRemove), 1);
        renderSizesEditor();
      });
    });
  }
  renderSizesEditor();
  document.getElementById('fSizeAdd').addEventListener('click', ()=>{
    productSizes.push({ label: '', stock: 0 });
    renderSizesEditor();
  });

  renderPhotoPreviews();
  const fImageFile = document.getElementById('fImageFile');

  fImageFile.addEventListener('change', ()=>{
    const files = Array.from(fImageFile.files || []);
    const slotsLeft = MAX_PHOTOS - productImages.length;
    if(slotsLeft <= 0){
      alert('Você já tem 8 fotos. Remova alguma antes de adicionar outra.');
      fImageFile.value = '';
      return;
    }
    files.slice(0, slotsLeft).forEach(file => compressAndAddPhoto(file));
    fImageFile.value = '';
  });

  function shrinkCanvas(canvas, startQ, limit){
    let q = startQ, url = canvas.toDataURL('image/jpeg', q), n = 0;
    while(url.length > limit && n < 25){
      q = Math.max(0.3, q - 0.05);
      url = canvas.toDataURL('image/jpeg', q);
      n++;
    }
    return url.length > limit ? null : url;
  }

  async function uploadPhotoToDrive(dataUrl){
    const cfg = (S.SYNC_CONFIG || {});
    const api = cfg.apiUrl, token = cfg.token;
    if(!api || !token) throw new Error('sync não configurado');
    const res = await fetch(api, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token, action: 'uploadImage', dataUrl }),
    });
    const data = await res.json();
    if(!data || !data.url) throw new Error((data && data.error) || 'falha no envio');
    return data.url;
  }

  function compressAndAddPhoto(file){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        const render = (maxDim)=>{
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#070706';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          return canvas;
        };
        // 1) tenta enviar em alta qualidade para o Google Drive (sem limite de tamanho da planilha)
        try{
          const big = shrinkCanvas(render(1800), 0.9, 2500000);
          if(big){
            const url = await uploadPhotoToDrive(big);
            productImages.push(url);
            renderPhotoPreviews();
            return;
          }
        }catch(err){
          window.__driveErr = String(err && err.message || err);
          console.warn('Envio ao Drive falhou, usando foto reduzida.', err);
        }
        // 2) plano B: foto menor guardada direto no produto
        let small = null;
        for(const d of [1400, 1100, 900, 700, 550]){
          small = shrinkCanvas(render(d), 0.85, 90000);
          if(small) break;
        }
        if(!small){
          alert('Não foi possível enviar a foto ao Google Drive' + (window.__driveErr ? ' (' + window.__driveErr + ')' : '') + ' e ela ficou grande demais para guardar no produto. Confira se o Apps Script foi atualizado e autorizado.');
          return;
        }
        productImages.push(small);
        renderPhotoPreviews();
      };
      img.onerror = ()=> alert('Não foi possível ler uma das imagens. Tente um arquivo JPG ou PNG.');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  if(!isNew){
    document.getElementById('mDelete').addEventListener('click', ()=>{
      if(!confirm(`Excluir definitivamente "${p.name}"? Esta ação não pode ser desfeita.`)) return;
      const products = S.getProducts().filter(x=>x.id!==p.id);
      S.saveProducts(products);
      S.addAudit('product_delete', `Produto "${p.name}" excluído.`, session.name);
      closeModal(); renderView();
    });
  }
  document.getElementById('mSave').addEventListener('click', ()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ alert('Informe o nome do produto.'); return; }
    const validSizes = productSizes.filter(s => s.label.trim());
    if(!validSizes.length){ alert('Adicione pelo menos um tamanho.'); return; }
    const updated = {
      ...p,
      name,
      cat: document.getElementById('fCat').value,
      tag: document.getElementById('fTag').value.trim() || 'Camiseta',
      priceCents: Math.round(Number(document.getElementById('fPrice').value||0)*100),
      costCents: Math.round(Number(document.getElementById('fCost').value||0)*100),
      sku: document.getElementById('fSku').value.trim(),
      status: document.getElementById('fStatus').value,
      images: productImages.slice(),
      sizes: validSizes.map(s => ({ label: s.label.trim(), stock: s.stock })),
      desc: document.getElementById('fDesc').value.trim(),
    };
    delete updated.image;
    delete updated.stockQuantity;
    const products = S.getProducts();
    const idx = products.findIndex(x=>x.id===p.id);
    if(idx>=0) products[idx] = updated; else products.unshift(updated);
    S.saveProducts(products);
    S.addAudit(isNew?'product_create':'product_update', `${isNew?'Produto criado':'Produto atualizado'}: ${updated.name}.`, session.name);
    closeModal(); renderView();
  });
}

function updateOrderStatus(order, status, paymentMethod, label){
  const orders = S.getOrders();
  const idx = orders.findIndex(o=>o.id===order.id);
  if(idx<0) return;
  const wasPaid = ['paid','preparing','shipped','fulfilled'].includes(orders[idx].status);
  const nowPaid = ['paid','preparing','shipped','fulfilled'].includes(status);
  orders[idx].status = status;
  orders[idx].paymentMethod = paymentMethod;
  orders[idx].events = orders[idx].events || [];
  orders[idx].events.unshift({ id:S.uid('ev'), label, actor:session.name, createdAt:S.nowISO() });

  // baixa/restaura estoque quando o status vira/deixa de ser pago
  if(!wasPaid && nowPaid && !orders[idx].stockDeducted){
    const products = S.getProducts();
    orders[idx].items.forEach(item=>{
      const p = products.find(x=>x.id===item.productId);
      if(p) S.adjustStock(p, -item.quantity, item.size);
    });
    S.saveProducts(products);
    orders[idx].stockDeducted = true;
  } else if(wasPaid && status==='cancelled' && orders[idx].stockDeducted){
    const products = S.getProducts();
    orders[idx].items.forEach(item=>{
      const p = products.find(x=>x.id===item.productId);
      if(p) S.adjustStock(p, item.quantity, item.size);
    });
    S.saveProducts(products);
    orders[idx].stockDeducted = false;
  }

  S.saveOrders(orders);
  S.addAudit('order_update', `Pedido ${order.id}: ${label}`, session.name);
}

        ${d.items.map((it,i)=>manualItemRowHTML(it,i,products)).join('')}
      </div>
      <button class="btn" id="addItemBtn" style="margin-bottom:16px;">＋ Adicionar peça</button>
      <div class="field"><label>Forma De Pagamento</label>
        <select id="fPayment">
          <option value="PIX" ${d.paymentMethod==='PIX'?'selected':''}>PIX</option>
          <option value="Dinheiro" ${d.paymentMethod==='Dinheiro'?'selected':''}>Dinheiro</option>
          <option value="Cartão" ${d.paymentMethod==='Cartão'?'selected':''}>Cartão</option>
        </select>
      </div>
      <div class="totals-row grand"><span>Total (venda confirmada)</span><b>${money(subtotal)}</b></div>
      <div class="field-hint">O pedido será registrado como pago e o estoque das peças será baixado imediatamente.</div>
    </div>
    <footer>
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mConfirm">Confirmar e gerar pedido</button>
    </footer>
  `, 'wide');
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  document.getElementById('fCustomer').addEventListener('change', e=>{
    const c = customers.find(x=>x.id===e.target.value);
    d.customerId = e.target.value;
    d.customerName = c ? c.name : d.customerName;
    d.customerPhone = c ? c.phone : d.customerPhone;
    renderManualOrderModal(products, customers);
  });
  document.getElementById('fCName').addEventListener('input', e=> d.customerName = e.target.value);
  document.getElementById('fCPhone').addEventListener('input', e=> d.customerPhone = e.target.value);
  document.getElementById('fPayment').addEventListener('change', e=> d.paymentMethod = e.target.value);
  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    d.items.push({ productId:'', qty:1 });
    renderManualOrderModal(products, customers);
  });
  document.querySelectorAll('.manual-item-row').forEach(row=>{
    const i = Number(row.dataset.index);
    row.querySelector('select').addEventListener('change', e=>{ d.items[i].productId = e.target.value; renderManualOrderModal(products, customers); });
    const dec = row.querySelector('[data-qc="dec"]'), inc = row.querySelector('[data-qc="inc"]');
    if(dec) dec.addEventListener('click', ()=>{ d.items[i].qty = Math.max(1, d.items[i].qty-1); renderManualOrderModal(products, customers); });
    if(inc) inc.addEventListener('click', ()=>{ d.items[i].qty = d.items[i].qty+1; renderManualOrderModal(products, customers); });
    const rm = row.querySelector('.rm');
    if(rm) rm.addEventListener('click', ()=>{ d.items.splice(i,1); renderManualOrderModal(products, customers); });
  });
  document.getElementById('mConfirm').addEventListener('click', ()=>{
    if(!d.customerName.trim() || !d.customerPhone.trim()){ alert('Informe nome e WhatsApp do cliente.'); return; }
    const validItems = d.items.filter(it=>it.productId);
    if(!validItems.length){ alert('Adicione ao menos uma peça válida.'); return; }
    const orderItems = validItems.map(it=>{
      const p = products.find(x=>x.id===it.productId);
      return { productId:p.id, name:p.name, quantity:it.qty, unitPriceCents:p.priceCents };
    });
    const subtotalCents = orderItems.reduce((s,i)=>s+i.unitPriceCents*i.quantity,0);
    const order = {
      id: S.nextOrderId(S.getOrders()),
      customerName: d.customerName.trim(), customerPhone: d.customerPhone.trim(),
      subtotalCents, deliveryCents:0, discountCents:0, totalCents: subtotalCents,
      status:'paid', deliveryStatus:'delivered', paymentMethod: d.paymentMethod,
      stockDeducted:true, items:orderItems,
      events:[{ id:S.uid('ev'), label:'Pedido gerado manualmente e marcado como pago', actor:session.name, createdAt:S.nowISO() }],
      createdAt: S.nowISO(),
    };
    const orders = S.getOrders(); orders.unshift(order); S.saveOrders(orders);
    const allProducts = S.getProducts();
    orderItems.forEach(item=>{
      const p = allProducts.find(x=>x.id===item.productId);
      if(p) S.adjustStock(p, -item.quantity, item.size);
    });
    S.saveProducts(allProducts);
    const custs = S.getCustomers();
    let c = custs.find(x=>x.phone===order.customerPhone);
    if(!c){ c = { id:S.uid('cli'), name:order.customerName, phone:order.customerPhone, email:'', createdAt:S.nowISO(), internalNotes:'', nextContactAt:'', contacts:[] }; custs.unshift(c); }
    else c.name = order.customerName;
    S.saveCustomers(custs);
    S.addAudit('order_create', `Pedido ${order.id} gerado manualmente por ${session.name} (${money(subtotalCents)}).`, session.name);
    closeModal(); goTo('orders');
  });
}

/* ================= CLIENTES ================= */
function renderCustomers(body, actions){
  const customers = S.getCustomers();
  const orders = S.getOrders();
  const enriched = customers.map(c => enrichCustomer(c, orders));
  const total = enriched.length;
  const revenue = enriched.reduce((s,c)=>s+c.revenueCents,0);
  const buyers = enriched.filter(c=>c.paidOrders>0).length;

  body.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><span>Total De Clientes</span><strong>${total}</strong></div>
      <div class="kpi"><span>Já Compraram</span><strong>${buyers}</strong></div>
      <div class="kpi"><span>Faturamento</span><strong>${money(revenue)}</strong></div>
    </div>
    <div class="search-row" style="margin-bottom:18px;"><input type="text" id="custSearch" placeholder="Buscar por nome ou WhatsApp" value="${escapeAttr(customerSearch)}"></div>
    <div class="panel-block" style="padding:0; overflow-x:auto;">
      <table class="customer-table">
        <thead><tr><th>Cliente</th><th>WhatsApp</th><th>Pedidos</th><th>Faturamento</th><th>Status</th></tr></thead>
        <tbody id="custBody"></tbody>
      </table>
    </div>
  `;
  document.getElementById('custSearch').addEventListener('input', e=>{
    customerSearch = e.target.value; renderCustomerRows(enriched);
  });
  renderCustomerRows(enriched);
}

function enrichCustomer(c, orders){
  const custOrders = orders.filter(o=>o.customerPhone===c.phone);
  const paidOrders = custOrders.filter(o=>['paid','preparing','shipped','fulfilled'].includes(o.status));
  const revenueCents = paidOrders.reduce((s,o)=>s+o.totalCents,0);
  const classification = paidOrders.length>=5 ? 'VIP' : paidOrders.length>=3 ? 'Recorrente' : paidOrders.length>=1 ? 'Ativo' : 'Novo';
  return { ...c, orders:custOrders, paidOrders:paidOrders.length, revenueCents, classification };
}

function renderCustomerRows(enriched){
  const tbody = document.getElementById('custBody');
  const filtered = enriched.filter(c => `${c.name} ${c.phone}`.toLowerCase().includes(customerSearch.toLowerCase()));
  if(!filtered.length){ tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Nenhum cliente registrado ainda. O primeiro cadastro aparece quando alguém finaliza um pedido na loja.</td></tr>`; return; }
  tbody.innerHTML = filtered.map(c => `
    <tr class="cust-row" data-id="${c.id}">
      <td><b>${escapeHtml(c.name)}</b></td>
      <td>${escapeHtml(c.phone)}</td>
      <td>${c.paidOrders}</td>
      <td>${money(c.revenueCents)}</td>
      <td><span class="classification-pill ${c.classification}">${c.classification}</span></td>
    </tr>
    ${expandedCustomer===c.id ? `<tr class="cust-detail-row"><td colspan="5">${customerDetailHTML(c)}</td></tr>` : ''}
  `).join('');
  tbody.querySelectorAll('.cust-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      expandedCustomer = expandedCustomer === row.dataset.id ? null : row.dataset.id;
      renderCustomerRows(enriched);
    });
  });
  const draftBtn = tbody.querySelector('#saveRelationship');
  if(draftBtn){
    const c = filtered.find(x=>x.id===expandedCustomer);
    draftBtn.addEventListener('click', ()=>{
      const notes = document.getElementById('custNotes').value;
      const nextContact = document.getElementById('custNextContact').value;
      const customers = S.getCustomers();
      const idx = customers.findIndex(x=>x.id===c.id);
      if(idx>=0){
        customers[idx].internalNotes = notes;
        customers[idx].nextContactAt = nextContact;
        S.saveCustomers(customers);
        S.addAudit('customer_update', `Relacionamento de ${c.name} atualizado.`, session.name);
      }
      renderView();
    });
  }
}

function renderDelivery(body){
  const fees = S.getDeliveryFees();
  const zones = [...new Set(fees.map(f=>f.zone))];
  body.innerHTML = `
    <div class="field-hint" style="margin-bottom:20px;">Os valores abaixo alimentam automaticamente o cálculo de frete da loja por zona de entrega.</div>
    ${can('delivery_manage') ? `
    <div class="panel-block" style="margin-bottom:24px;">
      <h3>Adicionar Vários Bairros De Uma Vez</h3>
      <div class="grid2">
        <div class="field"><label>Zona</label>
          <input type="text" id="fBulkZone" list="fZoneList" placeholder="Ex: João Pessoa">
          <datalist id="fZoneList">${zones.map(z=>`<option value="${escapeAttr(z)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>Frete Padrão (R$) — Opcional</label><input type="number" id="fBulkFee" min="0" step="0.01" placeholder="0,00"></div>
        <div class="field wide"><label>Bairros (Um Por Linha)</label><textarea id="fBulkNeighborhoods" rows="6" placeholder="Bessa&#10;Tambaú&#10;Manaíra"></textarea></div>
      </div>
      <button class="btn primary" id="fBulkAdd" style="margin-top:6px;">＋ Adicionar Bairros</button>
    </div>` : ''}
    <div class="delivery-zones">
      ${zones.map(zone => `
        <div class="zone-card">
          <h4 style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <span>${escapeHtml(zone)}</span>
            ${can('delivery_manage') ? `<button data-rename-zone="${escapeAttr(zone)}" style="font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; background:none; border:1px solid var(--panel-line); color:var(--muted); padding:4px 8px; cursor:pointer;">Renomear</button>` : ''}
          </h4>
          ${fees.filter(f=>f.zone===zone).map(f=>`
            <div class="zone-row">
              <span>${escapeHtml(f.neighborhood)}</span>
              <div class="zone-fee">
                <span>R$</span>
                <input type="number" min="0" step="0.01" data-id="${f.id}" value="${(f.feeCents/100).toFixed(2)}" ${can('delivery_manage')?'':'disabled'}>
                ${can('delivery_manage') ? `<button data-save="${f.id}">Salvar</button>` : ''}
                ${can('delivery_manage') ? `<button data-remove="${f.id}" style="color:var(--danger);">×</button>` : ''}
              </div>
            </div>`).join('')}
        </div>`).join('')}
    </div>
  `;
  body.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = Number(btn.dataset.save);
      const input = body.querySelector(`input[data-id="${id}"]`);
      const feeCents = Math.max(0, Math.round(Number(input.value||0)*100));
      const fees = S.getDeliveryFees();
      const f = fees.find(x=>x.id===id);
      f.feeCents = feeCents;
      S.saveDeliveryFees(fees);
      S.addAudit('delivery_update', `Frete de ${f.neighborhood} atualizado para ${money(feeCents)}.`, session.name);
      btn.textContent = 'Salvo ✓';
      setTimeout(()=> btn.textContent='Salvar', 1400);
    });
  });
  body.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = Number(btn.dataset.remove);
      let fees = S.getDeliveryFees();
      const f = fees.find(x=>x.id===id);
      if(!f) return;
      if(!confirm(`Remover "${f.neighborhood}" da lista de fretes?`)) return;
      fees = fees.filter(x=>x.id!==id);
      S.saveDeliveryFees(fees);
      S.addAudit('delivery_remove', `Bairro ${f.neighborhood} removido dos fretes.`, session.name);
      renderView();
    });
  });
  body.querySelectorAll('[data-rename-zone]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const oldZone = btn.dataset.renameZone;
      const newZone = prompt(`Novo nome para a zona "${oldZone}":`, oldZone);
      if(!newZone || !newZone.trim() || newZone.trim() === oldZone) return;
      const fees = S.getDeliveryFees();
      fees.forEach(f=>{ if(f.zone === oldZone) f.zone = newZone.trim(); });
      S.saveDeliveryFees(fees);
      S.addAudit('delivery_rename_zone', `Zona "${oldZone}" renomeada para "${newZone.trim()}".`, session.name);
      renderView();
    });
  });
  const bulkBtn = document.getElementById('fBulkAdd');
  if(bulkBtn){
    bulkBtn.addEventListener('click', ()=>{
      const zone = document.getElementById('fBulkZone').value.trim();
      const feeCents = Math.max(0, Math.round(Number(document.getElementById('fBulkFee').value||0)*100));
      const names = document.getElementById('fBulkNeighborhoods').value
        .split('\n').map(s=>s.trim()).filter(Boolean);
      if(!zone){ alert('Informe a zona (ex: João Pessoa).'); return; }
      if(!names.length){ alert('Cole ao menos um bairro, um por linha.'); return; }
      const fees = S.getDeliveryFees();
      let nextId = fees.reduce((max,f)=> Math.max(max, Number(f.id)||0), 0) + 1;
      let added = 0;
      names.forEach(neighborhood=>{
        const exists = fees.some(f=>f.zone===zone && f.neighborhood.toLowerCase()===neighborhood.toLowerCase());
        if(exists) return;
        fees.push({ id: nextId++, zone, neighborhood, feeCents });
        added++;
      });
      S.saveDeliveryFees(fees);
      S.addAudit('delivery_bulk_add', `${added} bairro(s) adicionados à zona ${zone}.`, session.name);
      renderView();
    });
  }
}

const EXPENSE_CATEGORIES = ['Matéria-prima', 'Embalagem', 'Frete/Logística', 'Marketing', 'Ferramentas/Assinaturas', 'Taxas e impostos', 'Outros'];

function renderFinance(body, actions){
  const expenses = S.getExpenses();
  const now = new Date();
  const monthKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const thisMonth = expenses.filter(e => (e.date||'').slice(0,7) === monthKey);
  const totalMonth = thisMonth.reduce((s,e)=> s + (e.amountCents||0), 0);
  const totalAll = expenses.reduce((s,e)=> s + (e.amountCents||0), 0);
  const orders = S.getOrders();
  const revenueMonth = orders.filter(o => ['paid','preparing','shipped','fulfilled'].includes(o.status) && (o.createdAt||'').slice(0,7) === monthKey)
    .reduce((s,o)=> s + (o.totalCents||0), 0);
  const netMonth = revenueMonth - totalMonth;

  actions.innerHTML = can('finance_manage') ? `<button class="btn primary" id="newExpenseBtn">＋ Nova Despesa</button>` : '';

  body.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><span>Custos Este Mês</span><strong>${money(totalMonth)}</strong><small>${thisMonth.length} lançamento(s)</small></div>
      <div class="kpi"><span>Faturamento Este Mês</span><strong>${money(revenueMonth)}</strong><small>pedidos pagos</small></div>
      <div class="kpi"><span>Resultado Do Mês</span><strong style="color:${netMonth>=0?'var(--ok)':'var(--danger)'}">${money(netMonth)}</strong><small>faturamento − custos</small></div>
      <div class="kpi"><span>Custos No Total</span><strong>${money(totalAll)}</strong><small>desde o início</small></div>
    </div>
    <div class="panel-block">
      <h3>Lançamentos</h3>
      ${expenses.length ? `
        <table class="data-table">
          <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr></thead>
          <tbody>
            ${expenses.map(e => `
              <tr>
                <td>${e.date ? new Date(e.date+'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                <td>${escapeHtml(e.description)}${e.notes ? `<br><small style="color:var(--muted);">${escapeHtml(e.notes)}</small>` : ''}</td>
                <td>${escapeHtml(e.category||'Outros')}</td>
                <td>${money(e.amountCents)}</td>
                <td>${can('finance_manage') ? `<button data-remove-expense="${e.id}" style="background:none; border:none; color:var(--danger); cursor:pointer;">×</button>` : ''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      ` : '<div class="empty-state">Nenhuma despesa registrada ainda. Clique em "＋ Nova Despesa" para começar.</div>'}
    </div>
  `;

  const newBtn = document.getElementById('newExpenseBtn');
  if(newBtn) newBtn.addEventListener('click', openExpenseModal);

  body.querySelectorAll('[data-remove-expense]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.removeExpense;
      if(!confirm('Excluir esse lançamento definitivamente?')) return;
      const list = S.getExpenses().filter(e=>e.id!==id);
      S.saveExpenses(list);
      S.addAudit('expense_remove', `Despesa ${id} removida.`, session.name);
      renderView();
    });
  });
}

function openExpenseModal(){
  const today = new Date().toISOString().slice(0,10);
  showModal(`
    <header><h3>Nova Despesa</h3><button class="close" id="mClose">×</button></header>
    <div class="modal-body">
      <div class="grid2">
        <div class="field wide"><label>Descrição</label><input id="fExpDesc" placeholder="Ex.: Compra de tecido pima"></div>
        <div class="field"><label>Valor (R$)</label><input id="fExpAmount" type="number" min="0" step="0.01" placeholder="0,00"></div>
        <div class="field"><label>Data</label><input id="fExpDate" type="date" value="${today}"></div>
        <div class="field wide"><label>Categoria</label>
          <select id="fExpCategory">
            ${EXPENSE_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <div class="field wide"><label>Notas (Opcional)</label><textarea id="fExpNotes" rows="2" placeholder="Detalhes adicionais"></textarea></div>
      </div>
    </div>
    <footer>
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mSave">Salvar</button>
    </footer>
  `);
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mSave').addEventListener('click', ()=>{
    const description = document.getElementById('fExpDesc').value.trim();
    const amountCents = Math.round(Number(document.getElementById('fExpAmount').value||0)*100);
    if(!description){ alert('Informe uma descrição para a despesa.'); return; }
    if(!amountCents){ alert('Informe um valor maior que zero.'); return; }
    S.addExpense({
      description,
      amountCents,
      date: document.getElementById('fExpDate').value || today,
      category: document.getElementById('fExpCategory').value,
      notes: document.getElementById('fExpNotes').value.trim(),
    });
    closeModal(); renderView();
  });
}

        <div><small>${u.role==='admin'?'ADMINISTRADOR':'USUÁRIO'}</small><b>${escapeHtml(u.name)}</b></div>
      </div>
      <div class="meta" style="color:var(--muted); font-size:0.8rem; margin-bottom:12px;">${escapeHtml(u.email)}</div>
      <div class="perms">${perms.map(p=>`<span>${permissionLabels[p][0]}</span>`).join('')}</div>
      <footer>
        <small class="${u.status}">${u.status==='active'?'● ATIVO':'○ INATIVO'}</small>
        <button data-edit-user="${u.id}">Editar Acesso</button>
      </footer>
    </div>`;
}

function openUserModal(user){
  const isNew = !user;
  const u = user || { id:S.uid('u'), name:'', email:'', password:'', role:'editor', status:'active', permissions:['stock_manage'] };
  showModal(`
    <header><h3>${isNew?'Novo Usuário':'Editar Acesso'}</h3><button class="close" id="mClose">×</button></header>
    <div class="modal-body">
      <div class="grid2">
        <div class="field wide"><label>Nome Completo</label><input id="fName" value="${escapeAttr(u.name)}"></div>
        <div class="field wide"><label>E-mail</label><input id="fEmail" type="email" value="${escapeAttr(u.email)}"></div>
        <div class="field"><label>Perfil</label>
          <select id="fRole">
            <option value="editor" ${u.role==='editor'?'selected':''}>Usuário com permissões</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>Administrador completo</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select id="fStatus">
            <option value="active" ${u.status==='active'?'selected':''}>Ativo</option>
            <option value="inactive" ${u.status==='inactive'?'selected':''}>Inativo</option>
          </select>
        </div>
        <div class="field wide"><label>${isNew?'Senha Inicial':'Nova Senha (Opcional)'}</label><input id="fPassword" type="password" placeholder="${isNew?'Mínimo 8 caracteres':'Deixe em branco para manter a atual'}"></div>
      </div>
      <p class="eyebrow" style="margin:18px 0 8px;">PERMISSÕES</p>
      <div id="permList">
        ${Object.entries(permissionLabels).map(([key,[label,desc]])=>`
          <label class="perm-check">
            <input type="checkbox" data-perm="${key}" ${(u.role==='admin'||u.permissions.includes(key))?'checked':''} ${u.role==='admin'?'disabled':''}>
            <span><b>${label}</b><small>${desc}</small></span>
          </label>`).join('')}
      </div>
    </div>
    <footer>
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mSave">Salvar usuário</button>
    </footer>
  `);
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  const roleSelect = document.getElementById('fRole');
  roleSelect.addEventListener('change', ()=>{
    document.querySelectorAll('#permList input[type=checkbox]').forEach(cb=>{
      cb.disabled = roleSelect.value === 'admin';
      if(roleSelect.value==='admin') cb.checked = true;
    });
  });
  document.getElementById('mSave').addEventListener('click', ()=>{
    const name = document.getElementById('fName').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    if(!name || !email){ alert('Preencha nome e e-mail.'); return; }
    const password = document.getElementById('fPassword').value;
    if(isNew && password.length<8){ alert('A senha inicial deve ter ao menos 8 caracteres.'); return; }
    const role = document.getElementById('fRole').value;
    const status = document.getElementById('fStatus').value;
    const permissions = role==='admin' ? Object.keys(permissionLabels) :
      [...document.querySelectorAll('#permList input[type=checkbox]:checked')].map(cb=>cb.dataset.perm);
    const users = S.getUsers();
    const idx = users.findIndex(x=>x.id===u.id);
    const record = { id:u.id, name, email, role, status, permissions, password: password ? password : u.password, createdAt:u.createdAt||S.nowISO(), updatedAt:S.nowISO() };
    if(idx>=0) users[idx] = record; else users.unshift(record);
    S.saveUsers(users);
    S.addAudit('user_update', `${isNew?'Usuário criado':'Usuário atualizado'}: ${name}.`, session.name);
    closeModal(); renderView();
  });
}

/* ================= MODAL HELPERS ================= */
function showModal(html, size){
  const backdrop = document.getElementById('modalBackdrop');
  const box = document.getElementById('modalBox');
  box.className = 'modal' + (size==='wide' ? ' wide' : '');
  box.innerHTML = html;
  backdrop.classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', e=>{ if(e.target.id==='modalBackdrop') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(str){ return escapeHtml(str); }
</script>

<div id="syncBadge" style="display:none; position:fixed; bottom:22px; right:22px; z-index:400;
  background:var(--charcoal); border:1px solid var(--panel-line); color:var(--muted);
  font-family:'Jost',sans-serif; font-size:0.72rem; letter-spacing:0.06em;
  padding:10px 16px; cursor:pointer; user-select:none; transition:all .3s;"
  onmouseover="this.style.borderColor='var(--gold)'; this.style.color='var(--gold-bright)';"
  onmouseout="this.style.borderColor='var(--panel-line)'; this.style.color='var(--muted)';"
></div>
<script>
(function(){
  const badge = document.getElementById('syncBadge');
  if(!window.JGStore || !JGStore.isSyncConfigured || !JGStore.isSyncConfigured()){
    return; // sincronização ainda não configurada — sem badge, sem polling
  }
  badge.style.display = 'block';

  async function doSync(){
    badge.textContent = 'Sincronizando…';
    const [orders] = await Promise.all([
      JGStore.syncOrders(),
      JGStore.syncCustomers ? JGStore.syncCustomers() : null,
      JGStore.syncWaitlist ? JGStore.syncWaitlist() : null,
      JGStore.syncProducts ? JGStore.syncProducts() : null,
      JGStore.syncUsers ? JGStore.syncUsers() : null,
      JGStore.syncDelivery ? JGStore.syncDelivery() : null,
      JGStore.syncExpenses ? JGStore.syncExpenses() : null,
    ]);
    if(typeof renderView === 'function') renderView();
    const hora = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    badge.textContent = orders
      ? ('Atualizado às ' + hora)
      : ('Falha ao sincronizar — tentando de novo…');
  }

  badge.addEventListener('click', doSync);
  doSync();
  setInterval(doSync, 20000); // atualiza sozinho a cada 20s
})();
</script>
